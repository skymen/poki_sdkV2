name: Build and Release
on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Node.js
        uses: actions/setup-node@v3
        with:
          node-version: 18

      - name: Install dependencies and build
        run: |
          npm ci
          npm run build

      - name: Get last modified file
        id: getfile
        run: |
          last_modified_file=$(ls -Art dist | tail -n 1)
          echo "Last modified file: $last_modified_file"
          echo "filename=$last_modified_file" >> $GITHUB_OUTPUT
          version=$(echo $last_modified_file | sed -n 's/.*-\([0-9.]*\).c3addon/\1/p')
          echo "Last modified file version: $version"
          echo "version=$version" >> $GITHUB_OUTPUT

      - name: Extract changelog for version
        id: changelog
        run: |
          version="${{ steps.getfile.outputs.version }}"

          # The GitHub release covers this version alone; it gets one per push.
          # The Construct notes are built further down, once the version that is
          # actually live over there is known.
          node build/changelog.js --version="$version" --format=markdown > /tmp/notes.md

          if [ -s /tmp/notes.md ]; then
            echo "Found changelog for version $version"
            echo "has_changelog=true" >> $GITHUB_OUTPUT
            echo "changelog<<CHANGELOG_EOF" >> $GITHUB_OUTPUT
            cat /tmp/notes.md >> $GITHUB_OUTPUT
            echo "" >> $GITHUB_OUTPUT
            echo "CHANGELOG_EOF" >> $GITHUB_OUTPUT
          else
            echo "No changelog entry found for version $version"
            echo "has_changelog=false" >> $GITHUB_OUTPUT
          fi

      - name: Create Release
        id: create_release
        uses: ncipollo/release-action@v1
        with:
          artifacts: "dist/${{ steps.getfile.outputs.filename }}"
          body: ${{ steps.changelog.outputs.has_changelog == 'true' && steps.changelog.outputs.changelog || '' }}
          omitBody: ${{ steps.changelog.outputs.has_changelog != 'true' }}
          tag: ${{ steps.getfile.outputs.filename }}
          name: v${{ steps.getfile.outputs.version }}
          allowUpdates: true
          makeLatest: true

      - name: Check if variables are set
        id: check
        run: |
          publish=true
          if [[ -z "${{ secrets.C3_AUTH_USER }}" ]]; then
            echo "C3 AUTH_USER is not set. skip publishing."
            publish=false
          fi
          if [[ -z "${{ secrets.C3_AUTH_PASSWORD }}" ]]; then
            echo "C3 AUTH_PASSWORD is not set. skip publishing."
            publish=false
          fi
          echo "publish=$publish" >> $GITHUB_OUTPUT

      - name: Install publish dependencies
        if: steps.check.outputs.publish == 'true'
        run: |
          npm install -g c3addon

      - name: Get Addon Url
        if: steps.check.outputs.publish == 'true'
        id: url
        run: |
          url=$(node -e "import('./buildconfig.js').then(m => console.log(m.publishConfig?.addonUrl ?? ''))")
          echo "Addon Url: $url"
          if [[ -z "$url" ]]; then
            echo "Addon Url is not set. skip publishing."
          fi
          echo "url=$url" >> $GITHUB_OUTPUT

      - name: Get the version already published
        if: steps.check.outputs.publish == 'true' && steps.url.outputs.url != ''
        id: live
        run: |
          raw="$(c3addon releases \
            --addon-url "${{ steps.url.outputs.url }}" \
            --username "${{ secrets.C3_AUTH_USER }}" \
            --password "${{ secrets.C3_AUTH_PASSWORD }}" \
            --latest 2>/dev/null | tail -n 1 || true)"

          # The command logs as it goes, so only take the answer if it looks
          # like a version rather than the last thing it happened to print.
          latest=""
          if echo "$raw" | grep -qE '^[0-9]+(\.[0-9]+){1,3}$'; then
            latest="$raw"
          fi

          echo "Latest published on Construct: ${latest:-unknown}"
          echo "version=$latest" >> $GITHUB_OUTPUT

          if [ -n "$latest" ] && [ "$latest" = "${{ steps.getfile.outputs.version }}" ]; then
            echo "${{ steps.getfile.outputs.version }} is already the published release. Skipping."
            echo "skip=true" >> $GITHUB_OUTPUT
          else
            echo "skip=false" >> $GITHUB_OUTPUT
          fi

      - name: Build the Construct release notes
        if: steps.check.outputs.publish == 'true' && steps.url.outputs.url != '' && steps.live.outputs.skip != 'true'
        run: |
          # Everything released since Construct last saw one, so a run that
          # failed to publish is not simply skipped over next time.
          since=""
          if [ -n "${{ steps.live.outputs.version }}" ]; then
            since="--since=${{ steps.live.outputs.version }}"
          fi

          limit="$(node -e "import('./buildconfig.js').then(m => console.log(m.publishConfig?.releaseNotesLimit ?? 0))")"

          node build/changelog.js \
            --version="${{ steps.getfile.outputs.version }}" \
            $since \
            --format=bbcode \
            --limit="$limit" > /tmp/notes.bbcode

          echo "Release notes ($(wc -c < /tmp/notes.bbcode) of $limit chars):"
          cat /tmp/notes.bbcode

      - name: Publish to Construct 3
        if: steps.check.outputs.publish == 'true' && steps.url.outputs.url != '' && steps.live.outputs.skip != 'true'
        run: |
          if [ -s /tmp/notes.bbcode ]; then
            release_notes="$(cat /tmp/notes.bbcode)"
          else
            release_notes="Released via GitHub Actions"
          fi

          c3addon publish "dist/${{ steps.getfile.outputs.filename }}" \
            --addon-url "${{ steps.url.outputs.url }}" \
            --username "${{ secrets.C3_AUTH_USER }}" \
            --password "${{ secrets.C3_AUTH_PASSWORD }}" \
            --release-notes "$release_notes"

      - name: Check if itch.io variables are set
        id: check_itch
        run: |
          publish=true
          if [[ -z "${{ secrets.BUTLER_API_KEY }}" ]]; then
            echo "BUTLER_API_KEY is not set. skip itch.io publishing."
            publish=false
          fi
          echo "publish=$publish" >> $GITHUB_OUTPUT

      - name: Get Itch.io Page
        if: steps.check_itch.outputs.publish == 'true'
        id: itchio
        run: |
          itchioPage=$(node -e "import('./buildconfig.js').then(m => console.log(m.publishConfig?.itchioPage ?? ''))")
          echo "Itch.io Page: $itchioPage"
          if [[ -z "$itchioPage" ]]; then
            echo "Itch.io Page is not set. skip itch.io publishing."
            echo "found=false" >> $GITHUB_OUTPUT
            exit 0
          fi

          # Extract username and game ID from "username/game-id" format
          itchUsername=$(echo "$itchioPage" | cut -d '/' -f 1)
          itchGameId=$(echo "$itchioPage" | cut -d '/' -f 2)

          echo "found=true" >> $GITHUB_OUTPUT
          echo "username=$itchUsername" >> $GITHUB_OUTPUT
          echo "gameId=$itchGameId" >> $GITHUB_OUTPUT

      - name: Publish to Itch.io
        if: steps.check_itch.outputs.publish == 'true' && steps.itchio.outputs.found == 'true'
        uses: KikimoraGames/itch-publish@v0.0.3
        with:
          butlerApiKey: ${{ secrets.BUTLER_API_KEY }}
          gameData: dist/${{ steps.getfile.outputs.filename }}
          itchUsername: ${{ steps.itchio.outputs.username }}
          itchGameId: ${{ steps.itchio.outputs.gameId }}
          buildChannel: c3addon
          buildNumber: ${{ steps.getfile.outputs.version }}
